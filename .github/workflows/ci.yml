name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vitest 5 requires Node >= 22.12; 22 is maintenance LTS, 24 is active LTS
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      # Uses lib/ like a consumer of the package would (isolatedModules, the
      # .d.ts rather than the sources).
      - name: Consumer check
        run: npm run check:consumer

      - name: Type-check (including tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:coverage

      # Not a performance gate (CI runners are too noisy for that); this only
      # makes sure the benchmark still runs and all buffers still agree.
      - name: Benchmark smoke run
        run: npm run bench -- --smoke

      # A short, fixed-seed fuzz campaign (about ten seconds); long campaigns
      # are available on demand in the Fuzz workflow.
      - name: Fuzz smoke run
        run: npm run fuzz -- --scenarios 60 --workers 2 --seed 1

  # Single, stable status check to mark as "required" in branch protection,
  # so the matrix above can change without having to update repo settings.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check test job result
        run: |
          echo "test job result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
