name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Type-check (including tests)
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage -- --ci

  # Single, stable status check to mark as "required" in branch protection,
  # so the matrix above can change without having to update repo settings.
  ci-passed:
    name: CI passed
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check test job result
        run: |
          echo "test job result: ${{ needs.test.result }}"
          test "${{ needs.test.result }}" = "success"
