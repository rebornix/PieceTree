name: Fuzz

# Long-running differential fuzzing of the persistent piece tree against
# PieceTreeBase and the array-of-lines model (npm run fuzz). Not a PR gate:
# CI runs a short fuzz as part of the tests; this runs for much longer, every
# night on the default branch and on demand for any branch.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to fuzz for, in minutes
        default: '30'
      seed:
        description: Seed of the campaign (empty for a random one)
        default: ''

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ inputs.minutes || '30' }} min)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fuzz
        run: >
          npm run fuzz --
          --minutes ${{ inputs.minutes || '30' }}
          --json fuzz-report.json
          ${{ inputs.seed && format('--seed {0}', inputs.seed) || '' }}

      # The report has the statistics and, for a failure, the shrunk scenario
      # to pin in differential.test.ts.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-report
          path: fuzz-report.json
          if-no-files-found: ignore
